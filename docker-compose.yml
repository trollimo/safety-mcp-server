# MCP-сервер (его видит агент) и approver (подтверждение записи) — один образ, разные пользователи и тома.
# Каталоги данных (conf, keys-ro, keys-rw, state, queue, approver-state) ищутся рядом с этим файлом
# или в каталоге, заданном через: docker compose --project-directory <каталог> -f docker-compose.yml ...
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  safety-mcp-server:
    <<: *hardening
    build:
      context: .
      args:
        PYTHON_VERSION: "${PYTHON_VERSION:-3.12}"
        MCP_UID: "${MCP_UID:-1000}"
        MCP_GID: "${MCP_GID:-1000}"
        APPROVER_UID: "${APPROVER_UID:-1001}"
        APPROVER_GID: "${APPROVER_GID:-1001}"
    image: safety-mcp-server:0.2.0
    user: mcp
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /keys:uid=${MCP_UID:-1000},gid=${MCP_GID:-1000},mode=0700   # сюда entry.sh копирует ключи с правами 600
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_BIND: 0.0.0.0                  # внутри контейнера; снаружи порт открыт только на 127.0.0.1
      MCP_HTTP_LISTEN_PORT: "8766"
      MCP_HTTP_TOKEN_FILE: /run/mcp-token
      MCP_HTTP_ALLOWED_HOSTS: "127.0.0.1:${MCP_HTTP_PORT:-8766},localhost:${MCP_HTTP_PORT:-8766}"
      MCP_STATE_DIR: /state
      MCP_QUEUE_DIR: /queue
      APPROVER_URL: http://127.0.0.1:8765
      MCP_ENROLL_HINT: "${MCP_ENROLL_HINT:-docker compose --project-directory local -f docker-compose.yml run --rm approver enroll --account <имя>}"
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8766}:8766"   # MCP для агента: http://127.0.0.1:8766/mcp
    volumes:
      - type: bind                 # inventory.json, commands.json, known_hosts.*
        source: ./conf
        target: /conf
        read_only: true
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind                 # Bearer-токен для клиента MCP (создаёт init-local.sh)
        source: ./mcp-token
        target: /run/mcp-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind                 # ТОЛЬКО ro-ключи; права на хосте не важны (копируются в tmpfs /keys)
        source: ${SAFETY_KEYS_RO_DIR:-./keys-ro}
        target: /keys-src
        read_only: true
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind                 # audit.log
        source: ./state
        target: /state
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind                 # MCP пишет заявки
        source: ./queue/requests
        target: /queue/requests
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind                 # результаты пишет approver
        source: ./queue/results
        target: /queue/results
        read_only: true
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root

  approver:
    <<: *hardening
    image: safety-mcp-server:0.2.0
    user: approver
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /keys-rw:uid=${APPROVER_UID:-1001},gid=${APPROVER_GID:-1001},mode=0700
    entrypoint: ["/app/docker/entry.sh", "python", "/app/approver.py"]
    command: ["serve", "--bind", "0.0.0.0", "--port", "8765"]
    environment:
      MCP_QUEUE_DIR: /queue
      APPROVER_DATA: /data
      APPROVER_ACCOUNT: "${APPROVER_ACCOUNT:-operator}"
      APPROVER_TOTP_SKEW: "${APPROVER_TOTP_SKEW:-50}"       # допустимое расхождение часов телефона и машины, с (0..120)
    ports:
      - "127.0.0.1:8765:8765"              # страница доступна только с этой машины
    volumes:
      - type: bind
        source: ./conf
        target: /conf
        read_only: true
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind                 # ТОЛЬКО здесь; копируются в tmpfs /keys-rw
        source: ${SAFETY_KEYS_RW_DIR:-./keys-rw}
        target: /keys-rw-src
        read_only: true
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind                 # otp.json, аудит approver
        source: ./approver-state
        target: /data
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind
        source: ./queue/requests
        target: /queue/requests
        read_only: true
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
      - type: bind
        source: ./queue/results
        target: /queue/results
        bind:
          create_host_path: false   # нет каталога -> ошибка, а не пустой каталог от root
